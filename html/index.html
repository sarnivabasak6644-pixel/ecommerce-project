<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BPC Store</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="navbar">
      <div class="nav-brand">
        <p>Quick Cart</p>
      </div>
      <div class="nav-search">
        <select class="search-select">
          <option>All</option>
        </select>
        <input placeholder="Search for items" class="search-input">
      </div>
    </div>

    <!-- Footer -->
    <footer class="custom-footer mt-5 py-5">
        <div class="container">
            <div class="row g-4 align-items-start">
                
                <!-- Logo Side -->
                <div class="col-md-4 text-center text-md-start">
                    <div class="footer-logo-circle mb-3 mx-auto mx-md-0">
                        <i class="fa-solid fa-cart-shopping cart-icon-lg"></i>
                    </div>
                    <h2 class="fw-bold">Quick cart</h2>
                </div>

                <!-- About Box -->
                <div class="col-md-5">
                    <div class="about-box p-4 border rounded-4 h-100">
                        <h4 class="text-maroon mb-4">About</h4>
                        <p class="fs-5">description</p>
                    </div>
                </div>

                <!-- Links Side -->
                <div class="col-md-3 d-flex justify-content-between">
                    <div>
                        <h6 class="fw-bold mb-3">Learn more</h6>
                        <ul class="list-unstyled footer-links">
                            <li><a href="#">content</a></li>
                            <li><a href="#">copywrite</a></li>
                            <li><a href="#">overview</a></li>
                            <li><a href="#">help & support</a></li>
                            <li><a href="#">privacy & security</a></li>
                            <li><a href="#">terms of service</a></li>
                            <li><a href="#">report</a></li>
                        </ul>
                    </div>
                    <div>
                        <h6 class="fw-bold mb-3">Social Links</h6>
                        <a href="#" class="text-dark fs-4"><i class="fa-brands fa-instagram"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap & Custom JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
